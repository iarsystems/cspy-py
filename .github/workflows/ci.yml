name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package (editable) and test tools
        run: pip install -r requirements-dev.txt

      - name: Validate Python sources
        run: python -m compileall -q src tests examples conftest.py

      - name: Run unit tests
        run: pytest -q -m "not live"

      - name: Build the distribution
        run: |
          pip install build
          python -m build --outdir dist .
          # The IDL must ship inside the iar-cspy wheel.
          python -m zipfile -l dist/iar_cspy-*.whl | grep -q "iar_cspy/idl/cspy.thrift"

  live-sim:
    name: Live simulator tests (cxarm)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 25
    env:
      CXARM_VERSION: "10.10.2"
      # IAR license bearer token (repository secret) for the license checkout.
      IAR_LMS_BEARER_TOKEN: ${{ secrets.IAR_LMS_BEARER_TOKEN }}
      THRIFT_CSPYSERVER_START_TIMEOUT_MS: "60000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package (editable) and test tools
        run: pip install -r requirements-dev.txt

      - name: Cache cxarm toolchain
        id: cache-cxarm
        uses: actions/cache@v4
        with:
          path: ~/iar/cxarm
          key: cxarm-${{ env.CXARM_VERSION }}-linux-x86_64-base

      - name: Download and extract cxarm
        if: steps.cache-cxarm.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/iar/cxarm
          curl -fsSL -o /tmp/cxarm.tar.bz2 \
            "https://github.com/iarsystems/arm/releases/download/${CXARM_VERSION}/cxarm-${CXARM_VERSION}-linux-x86_64-base.tar.bz2"
          tar -xjf /tmp/cxarm.tar.bz2 -C ~/iar/cxarm
          rm /tmp/cxarm.tar.bz2

      - name: Locate CSpyServer2
        id: cspy
        run: |
          CSPY="$(find ~/iar/cxarm -type f -name 'CSpyServer2' | head -n 1)"
          if [ -z "$CSPY" ]; then
            echo "CSpyServer2 not found in extracted toolchain:" >&2
            find ~/iar/cxarm -maxdepth 3 -type d >&2
            exit 1
          fi
          chmod +x "$CSPY"
          echo "path=$CSPY" >> "$GITHUB_OUTPUT"
          "$CSPY" --version || true

      # cxarm has no IarServiceLauncher, so the project (IDE services) tests skip.
      - name: Run live tests (bundled simulator firmware)
        timeout-minutes: 10
        run: >
          pytest -q -m live
          --timeout=240 --timeout-method=thread
          --cspy-cspyserver2="${{ steps.cspy.outputs.path }}"

      - name: Run example firmware tests
        timeout-minutes: 10
        run: >
          pytest -q examples/pytest
          --timeout=240 --timeout-method=thread
          --cspy-cspyserver2="${{ steps.cspy.outputs.path }}"

      - name: Show CSpyServer2 logs on failure
        if: failure()
        run: |
          for f in /tmp/cspyserver2-*.log; do
            [ -e "$f" ] || continue
            echo "===== $f ====="
            tail -n 200 "$f"
          done

      - name: Upload CSpyServer2 logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cspyserver2-logs
          path: /tmp/cspyserver2-*.log
          if-no-files-found: ignore
