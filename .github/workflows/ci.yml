name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package (editable) and test tools
        run: pip install -r requirements-dev.txt

      - name: Validate Python sources
        run: python -m compileall -q src tests examples conftest.py

      - name: Run unit tests
        run: pytest -q -m "not live"

      - name: Build the distribution
        run: |
          pip install build
          python -m build --outdir dist .
          # The IDL must ship inside the iar-cspy wheel.
          python -m zipfile -l dist/iar_cspy-*.whl | grep -q "iar_cspy/idl/cspy.thrift"
