[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iar-cspy"
version = "0.1.0"
description = "Experimental Python utility package for the IAR C-SPY debugger and IDE services, over their Thrift interfaces"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["thriftpy2>=0.5.2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Embedded Systems",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

# The fixtures load automatically wherever iar-cspy and pytest are installed.
# The entry point name is the module name, so an explicit
# "-p iar_cspy.pytest_plugin" is recognised as the same plugin.
[project.entry-points.pytest11]
"iar_cspy.pytest_plugin" = "iar_cspy.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iar_cspy = ["idl/*.thrift", "py.typed"]
